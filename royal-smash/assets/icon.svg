<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="rsBg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="48%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="28%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cannonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="blastGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ironBall" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="45%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="45%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Shield Base -->
  <rect width="512" height="512" rx="112" fill="url(#rsBg)"/>

  <!-- Subtle Radial Siege Sunburst Rays -->
  <g opacity="0.16" fill="#fde047">
    <polygon points="256,230 190,18 322,18"/>
    <polygon points="256,230 420,40 485,125"/>
    <polygon points="256,230 494,200 494,310"/>
    <polygon points="256,230 28,125 92,40"/>
    <polygon points="256,230 18,200 18,310"/>
  </g>

  <!-- Outer Royal Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#fef08a" stroke-opacity="0.3" stroke-width="2.5"/>

  <!-- Background Royal Castle Turrets (Being Smashed!) -->
  <g opacity="0.88">
    <!-- Left Castle Tower (Tilted from Impact) -->
    <g transform="translate(96, 152) rotate(-9)">
      <polygon points="0,0 36,-48 72,0" fill="url(#rubyGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
      <rect x="6" y="0" width="60" height="128" rx="6" fill="#3b82f6" stroke="url(#goldGrad)" stroke-width="5"/>
      <rect x="2" y="-6" width="68" height="14" rx="4" fill="url(#goldGrad)"/>
      <rect x="24" y="28" width="24" height="36" rx="12" fill="#0f172a" stroke="#fde047" stroke-width="3"/>
    </g>
    <!-- Right Castle Tower (Tilted Outward) -->
    <g transform="translate(344, 152) rotate(11)">
      <polygon points="0,0 36,-48 72,0" fill="url(#rubyGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
      <rect x="6" y="0" width="60" height="128" rx="6" fill="#7c3aed" stroke="url(#goldGrad)" stroke-width="5"/>
      <rect x="2" y="-6" width="68" height="14" rx="4" fill="url(#goldGrad)"/>
      <rect x="24" y="28" width="24" height="36" rx="12" fill="#0f172a" stroke="#fde047" stroke-width="3"/>
    </g>
  </g>

  <!-- Sovereign Golden Crown at Top Center -->
  <g transform="translate(156, 48)">
    <path d="M16 95 L4 28 L56 62 L100 8 L144 62 L196 28 L184 95 Z"
          fill="url(#crownGrad)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <rect x="14" y="92" width="172" height="24" rx="8" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3.5"/>
    <!-- Crown Jewels -->
    <circle cx="4" cy="22" r="8" fill="#fde047" stroke="#fff" stroke-width="2"/>
    <circle cx="100" cy="4" r="10" fill="#f43f5e" stroke="#fff" stroke-width="2.5"/>
    <circle cx="196" cy="22" r="8" fill="#fde047" stroke="#fff" stroke-width="2"/>
    <!-- Band Gems -->
    <polygon points="100,94 110,104 100,114 90,104" fill="#f43f5e" stroke="#fff" stroke-width="1.5"/>
    <circle cx="52" cy="104" r="6" fill="#10b981" stroke="#fff" stroke-width="1.5"/>
    <circle cx="148" cy="104" r="6" fill="#38bdf8" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- Explosive Muzzle Starburst Behind Cannonball -->
  <circle cx="332" cy="224" r="78" fill="url(#blastGlow)"/>
  <polygon points="332,142 350,192 404,174 374,220 416,256 362,258 370,308 332,270 294,308 302,258 248,256 290,220 260,174 314,192"
           fill="#fde047" opacity="0.92" stroke="#f97316" stroke-width="4" stroke-linejoin="round"/>

  <!-- Hero Royal Siege Cannon (Aimed Up-Right) -->
  <g transform="translate(115, 228)">
    <!-- Cannon Carriage Tail -->
    <path d="M12 128 L128 102 L152 142 L28 156 Z" fill="#b45309" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <!-- Tilted Royal Blue & Gold Cannon Barrel -->
    <g transform="rotate(-32 105 78)">
      <!-- Breech Cascabel Knob -->
      <circle cx="8" cy="78" r="18" fill="url(#goldGrad)" stroke="#fff" stroke-width="3"/>
      <!-- Main Barrel -->
      <path d="M18 46 L186 34 L186 122 L18 110 Z" fill="url(#cannonBody)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
      <!-- Gold Reinforcement Rings -->
      <rect x="62" y="42" width="18" height="72" rx="5" fill="url(#goldGrad)"/>
      <rect x="122" y="38" width="18" height="80" rx="5" fill="url(#goldGrad)"/>
      <rect x="174" y="28" width="24" height="100" rx="8" fill="url(#goldGrad)" stroke="#fff" stroke-width="3"/>
      <!-- Cannon Muzzle Bore -->
      <ellipse cx="196" cy="78" rx="8" ry="42" fill="#090d16" stroke="#fde047" stroke-width="3"/>
      <!-- Ruby Trunnion -->
      <circle cx="96" cy="78" r="15" fill="url(#rubyGrad)" stroke="url(#goldGrad)" stroke-width="5"/>
    </g>
    <!-- Heavy Golden Siege Wheel -->
    <circle cx="86" cy="126" r="48" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="10"/>
    <circle cx="86" cy="126" r="32" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="12 8"/>
    <line x1="86" y1="78" x2="86" y2="174" stroke="url(#goldGrad)" stroke-width="7"/>
    <line x1="38" y1="126" x2="134" y2="126" stroke="url(#goldGrad)" stroke-width="7"/>
    <circle cx="86" cy="126" r="16" fill="url(#goldGrad)" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Flying 3D Cannonball with Crown Emblem & Speed Trail -->
  <g transform="translate(348, 198)">
    <circle cx="0" cy="0" r="44" fill="url(#ironBall)" stroke="url(#goldGrad)" stroke-width="5"/>
    <!-- Specular Highlight -->
    <ellipse cx="-14" cy="-16" rx="12" ry="7" transform="rotate(-30 -14 -16)" fill="#ffffff" opacity="0.65"/>
    <!-- Mini Gold Crown Stamp on Cannonball -->
    <path d="M-16 10 L-20 -8 L-7 2 L0 -12 L7 2 L20 -8 L16 10 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Flying Gem & Brick Shards -->
  <polygon points="428,126 448,136 436,156 418,144" fill="#f43f5e" stroke="#fff" stroke-width="2"/>
  <polygon points="248,118 268,108 274,128 254,134" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
  <circle cx="436" cy="242" r="9" fill="#fde047"/>
  <circle cx="82" cy="248" r="8" fill="#fde047"/>

  <!-- VARNAMS Studio Gold Banner at Bottom -->
  <rect x="106" y="430" width="300" height="46" rx="23" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4.5"/>
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="25" letter-spacing="5.5" fill="#fef08a">VARNAMS</text>
</svg>
