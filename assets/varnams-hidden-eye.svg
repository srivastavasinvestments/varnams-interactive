<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Texture & Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="45%" stop-color="#0a0d17"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>

    <!-- Carbon Fiber Pattern -->
    <pattern id="carbonPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="none"/>
      <path d="M0 6 L6 0 L12 6 L6 12 Z" fill="#ffffff" fill-opacity="0.018"/>
      <path d="M6 6 L12 0 L12 12 Z" fill="#000000" fill-opacity="0.35"/>
      <line x1="0" y1="0" x2="12" y2="12" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.025"/>
    </pattern>

    <!-- Ambient Light Beams (matching reference image) -->
    <linearGradient id="ambientBeam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="ambientBeam2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- ===============================================================
         PRISMATIC FACET GRADIENTS (Exact Reference Match)
         =============================================================== -->
    <!-- Left Wing (Gold & Amber with Cyan Refraction) -->
    <linearGradient id="goldOuterTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldOuterMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="goldInnerReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldInnerFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Right Wing (Sapphire Blue, Cyan & Magenta/Fuchsia Refraction) -->
    <linearGradient id="cyanOuterTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyanOuterMid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="magentaInnerReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="75%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="magentaInnerFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Center Keel & Bottom Apex (Diamond Convergence) -->
    <linearGradient id="centerKeel" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="75%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bottomFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="bottomFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <!-- Hidden Eye Optical Filter (blend into facets) -->
    <filter id="esotericBlend" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <rect width="1024" height="1024" fill="url(#carbonPattern)"/>

  <!-- Dynamic Diagonal Ambient Rays (matching background lighting) -->
  <polygon points="1024,0 780,0 320,1024 560,1024" fill="url(#ambientBeam2)"/>
  <polygon points="0,0 240,0 700,1024 460,1024" fill="url(#ambientBeam1)"/>

  <!-- =====================================================================
       PRISMATIC GEMSTONE 'V' (CROWN REMOVED, EXACT GEOMETRY)
       ===================================================================== -->
  <g filter="url(#subtleDrop)" id="prismatic-v-structure">

    <!-- LEFT ARM: GOLD / AMBER GEMSTONE FACETS -->
    <!-- Facet L1: Top Flat Landing -->
    <polygon points="252,312 414,312 376,370 286,370" fill="url(#goldOuterTop)" stroke="#fff" stroke-width="0.8" stroke-opacity="0.6"/>
    <!-- Facet L2: Top Outer Left Bevel -->
    <polygon points="252,312 286,370 326,512 284,472" fill="url(#goldOuterMid)" stroke="#fef08a" stroke-width="0.5" stroke-opacity="0.5"/>
    <!-- Facet L3: Main Front Gold Facet (Diamond Cut) -->
    <polygon points="286,370 376,370 398,536 326,512" fill="url(#goldOuterTop)" stroke="#fff" stroke-width="0.8" stroke-opacity="0.7"/>
    <!-- Facet L4: Inner Refraction Facet (Cyan Internal Flare into Gold) -->
    <polygon points="376,370 414,312 512,522 398,536" fill="url(#goldInnerReflect)" stroke="#a5f3fc" stroke-width="0.7" stroke-opacity="0.8"/>
    <!-- Facet L5: Mid Lower Gold Wedge -->
    <polygon points="326,512 398,536 462,636 384,622" fill="url(#goldInnerFacet)" stroke="#fef08a" stroke-width="0.6" stroke-opacity="0.5"/>
    <!-- Facet L6: Lower Outer Left Flank -->
    <polygon points="326,512 384,622 438,698 372,610" fill="url(#goldOuterMid)" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- RIGHT ARM: SAPPHIRE / CYAN / MAGENTA GEMSTONE FACETS -->
    <!-- Facet R1: Top Flat Landing -->
    <polygon points="772,312 610,312 648,370 738,370" fill="url(#cyanOuterTop)" stroke="#fff" stroke-width="0.8" stroke-opacity="0.6"/>
    <!-- Facet R2: Top Outer Right Bevel -->
    <polygon points="772,312 738,370 698,512 740,472" fill="url(#cyanOuterMid)" stroke="#7dd3fc" stroke-width="0.5" stroke-opacity="0.5"/>
    <!-- Facet R3: Main Front Cyan/Blue Facet -->
    <polygon points="738,370 648,370 626,536 698,512" fill="url(#cyanOuterTop)" stroke="#fff" stroke-width="0.8" stroke-opacity="0.7"/>
    <!-- Facet R4: Inner Refraction Facet (Hot Magenta/Fuchsia Flare) -->
    <polygon points="648,370 610,312 512,522 626,536" fill="url(#magentaInnerReflect)" stroke="#f472b6" stroke-width="0.7" stroke-opacity="0.8"/>
    <!-- Facet R5: Mid Lower Magenta/Violet Wedge -->
    <polygon points="698,512 626,536 562,636 640,622" fill="url(#magentaInnerFacet)" stroke="#c084fc" stroke-width="0.6" stroke-opacity="0.5"/>
    <!-- Facet R6: Lower Outer Right Flank -->
    <polygon points="698,512 640,622 586,698 652,610" fill="url(#cyanOuterMid)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- LOWER APEX & BOTTOM POINT TERMINATION -->
    <!-- Facet B1: Central Convergence Keel Diamond -->
    <polygon points="512,522 462,636 512,692 562,636" fill="url(#centerKeel)" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.85"/>
    <!-- Facet B2: Bottom Point Left Facet -->
    <polygon points="462,636 512,692 512,732 438,698" fill="url(#bottomFacetLeft)" stroke="#fbbf24" stroke-width="0.6" stroke-opacity="0.6"/>
    <!-- Facet B3: Bottom Point Right Facet -->
    <polygon points="562,636 512,692 512,732 586,698" fill="url(#bottomFacetRight)" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.6"/>
    <!-- Facet B4: Sharpest Terminal Bottom Tip -->
    <polygon points="512,692 506,738 512,746 518,738" fill="#ffffff" stroke="#00f2fe" stroke-width="0.5"/>
  </g>

  <!-- =====================================================================
       THE HIDDEN SECRET SOCIETY EYE (CONCEALED IN THE FACET GEOMETRY)
       Only visible to those who examine closely or know the sacred secret!
       ===================================================================== -->
  <g id="hidden-society-eye" filter="url(#esotericBlend)">
    
    <!-- 1. The Sacred Triangle of Providence (Faint Watermark Alignment) -->
    <!-- Traced along the V's inner apex and top vertices -->
    <polygon points="512,284 668,554 356,554" 
             fill="none" 
             stroke="#fbbf24" 
             stroke-width="1.2" 
             stroke-opacity="0.16" 
             stroke-dasharray="8 6"/>

    <!-- 2. Radiating Sacred Caustic Beams (Disguised as ambient lens flare lines) -->
    <g stroke="#ffffff" stroke-width="0.75" opacity="0.14">
      <line x1="512" y1="454" x2="512" y2="230"/>
      <line x1="512" y1="454" x2="420" y2="250"/>
      <line x1="512" y1="454" x2="604" y2="250"/>
      <line x1="512" y1="454" x2="340" y2="300"/>
      <line x1="512" y1="454" x2="684" y2="300"/>
      <line x1="512" y1="454" x2="280" y2="370"/>
      <line x1="512" y1="454" x2="744" y2="370"/>
    </g>

    <!-- 3. The Concealed Eye Contour (Eyelids follow the inner V facet reflection curves) -->
    <!-- Upper Eyelid Curve (Curving naturally across the cleft) -->
    <path d="M 436,454 C 472,408 552,408 588,454" 
          fill="none" 
          stroke="#fef08a" 
          stroke-width="1.6" 
          stroke-opacity="0.28" 
          stroke-linecap="round"/>

    <!-- Lower Eyelid Curve (Following the facet cleavage) -->
    <path d="M 436,454 C 472,496 552,496 588,454" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="1.4" 
          stroke-opacity="0.24" 
          stroke-linecap="round"/>

    <!-- Soft Ethereal Sclera Glow (Gently lighting the inner eye area) -->
    <path d="M 440,454 C 472,414 552,414 584,454 C 552,490 472,490 440,454 Z" 
          fill="#00f2fe" 
          fill-opacity="0.045"/>

    <!-- 4. The Concealed Iris (Concentric Arcane Rings disguised as diamond refraction) -->
    <circle cx="512" cy="454" r="30" fill="none" stroke="#fde047" stroke-width="1.2" stroke-opacity="0.22" stroke-dasharray="3 4"/>
    <circle cx="512" cy="454" r="22" fill="none" stroke="#00f2fe" stroke-width="1.4" stroke-opacity="0.26"/>
    <circle cx="512" cy="454" r="14" fill="none" stroke="#ec4899" stroke-width="0.8" stroke-opacity="0.20"/>

    <!-- 5. The Concealed Pupil (Appears as a central brilliant starburst reflection) -->
    <!-- Deep core node -->
    <circle cx="512" cy="454" r="7.5" fill="#060913" fill-opacity="0.45"/>
    <circle cx="512" cy="454" r="4" fill="#ffffff" fill-opacity="0.65" filter="url(#softGlow)"/>

    <!-- Starburst Glint Rays (Diamond Catchlight disguise) -->
    <line x1="512" y1="441" x2="512" y2="467" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
    <line x1="499" y1="454" x2="525" y2="454" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
    <line x1="503" y1="445" x2="521" y2="463" stroke="#fef08a" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="503" y1="463" x2="521" y2="445" stroke="#a5f3fc" stroke-width="0.8" stroke-opacity="0.4"/>
  </g>

  <!-- =====================================================================
       TYPOGRAPHY (VARNAMS INTERACTIVE — Matching Reference Style)
       ===================================================================== -->
  <g text-anchor="middle" filter="url(#subtleDrop)">
    <!-- Primary Wordmark: VARNAMS -->
    <text x="512" y="864" 
          font-family="'Space Grotesk', -apple-system, sans-serif" 
          font-size="62" 
          font-weight="900" 
          letter-spacing="12" 
          fill="url(#wordmarkGrad)">
      VARNAMS
    </text>

    <!-- Subtitle: INTERACTIVE -->
    <text x="512" y="914" 
          font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="16" 
          fill="#94a3b8" 
          opacity="0.95">
      INTERACTIVE
    </text>
  </g>
</svg>
